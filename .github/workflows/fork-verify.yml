name: fork-verify

# Minimal fork-only CI for gascity forks. Verifies WIP feature branches
# WITHOUT upstream's Blacksmith
# self-hosted runners, runner-policy gating, or secrets — none of which a fork
# has. ubuntu-latest compiles the Dolt go-icu-regex CGO dependency cleanly; the
# `unicode/regex.h` build failure is macOS-only (icu4c@78 header layout), so a
# Linux runner is exactly what's needed to get a real green/red signal.
#
# Reuses the upstream composite action .github/actions/setup-gascity-ubuntu so
# the Go + Dolt + native-dependency setup is not re-solved here.

on:
  # Gate every proposed change to the fork integration branch.  Selecting
  # source branches here would let a newly introduced branch convention skip
  # CI entirely.
  pull_request:
    # develop is the fork integration branch; main, hotfix/** and release/**
    # are listed so the workflow covers every base upstream's branch-filter
    # policy names, even though the fork does not currently target them.
    branches: [develop, main, "hotfix/**", "release/**"]
  workflow_dispatch:

permissions:
  contents: read
  # dorny/paths-filter reads the pull-request file list when this workflow
  # runs for a PR; contents: read alone is insufficient for that API call.
  pull-requests: read

jobs:
  verify:
    outputs:
      handoff-config-proof: ${{ steps.handoff-config-proof.outputs.passed }}
    # Canonical PR branches already run the complete Blacksmith CI graph.
    # This lightweight fallback exists only for forks that cannot use those
    # runners or repository secrets.
    if: ${{ github.repository != 'gastownhall/gascity' }}
    runs-on: ubuntu-latest
    env:
      DOLT_VERSION: "2.6.0"
      BD_VERSION: "v1.3.4"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Broad tmux integration coverage belongs to upstream CI. The fork also
      # executes the narrow, non-model cold-start controller regression below.
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: runtime-tmux
        with:
          filters: |
            runtime_tmux:
              - 'internal/runtime/tmux/**'
              - 'scripts/runtime-tmux-tests.manifest'
              - 'cmd/gc/phase2_real_transport_test.go'
              - 'cmd/gc/session_reconciler.go'
              - 'cmd/gc/cmd_runtime_drain.go'
              - '.github/workflows/fork-verify.yml'
      - uses: ./.github/actions/setup-gascity-ubuntu
        with:
          dolt-version: ${{ env.DOLT_VERSION }}
          bd-version: ${{ env.BD_VERSION }}
          install-claude-cli: "false"
      - name: Watchdog contract and execution-validator tests
        run: |
          go test ./scripts/prwatchdog/... -count=1
          python3 -m unittest discover -s scripts/prwatchdog -p 'test_handoff_proof.py'
      - name: Executed handoff/config proof
        id: handoff-config-proof
        env:
          PROOF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/prwatchdog/handoff_proof.py --head "$PROOF_HEAD_SHA"
          echo 'passed=true' >> "$GITHUB_OUTPUT"
      - name: Preserve executed handoff/config evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: handoff-config-proof
          path: handoff-config-proof/
          if-no-files-found: error
      - name: Build (compiles the whole tree — catches compile errors the macOS ICU break hides)
        run: go build ./...
      - name: Compile changed tmux integration package
        id: compile-runtime-tmux-integration
        if: ${{ steps.runtime-tmux.outputs.runtime_tmux == 'true' }}
        run: go test -tags=integration -run '^$' ./internal/runtime/tmux
      # Runs the package's non-integration tests (isolated per-test tmux sockets
      # via test/tmuxtest, never the default server). Integration-tagged tests
      # stay excluded here: they gate on GC_TMUX_INTEGRATION=1 and are the
      # upstream CI graph's job. Without this step the compile-only check above
      # let PR #108 ship nine stale 5-field display-message fixtures that
      # silently stopped exercising seven tests, including two destructive
      # multi-pane guards, while CI stayed green (gcw-vmm00.32).
      - name: Unit tests — tmux runtime (no live tmux server required)
        id: test-runtime-tmux
        if: ${{ steps.runtime-tmux.outputs.runtime_tmux == 'true' }}
        run: go test ./internal/runtime/tmux/... -count=1
      - name: Cold tmux controller startup (non-model fixture)
        if: ${{ steps.runtime-tmux.outputs.runtime_tmux == 'true' }}
        run: go test -tags=integration ./cmd/gc/ -run '^TestReconcilerColdTmuxMetadataAllowsFirstStart$' -count=1 -v
      - name: Vet changed package
        run: go vet ./cmd/gc/...
      - name: Unit tests — cross-store work delivery
        run: go test ./cmd/gc/ -run 'TestFilterAssignedWorkBeads|TestAssignedWork|TestFirstStoreWithWork|TestCrossStoreClaimDir|TestRunBDForBead|TestGateOpenWorkBounded|TestCrossStorePipeline' -count=1 -v
      - name: Unit tests — cross-store reachability predicate + fail-loud guard
        run: |
          go test ./internal/agentutil/ -run 'TestAgentReachesWorkflowStore|TestAgentIsCrossStoreEligible' -count=1 -v
          go test ./internal/sling/ -run 'TestValidateBuiltInRouteStoreReachableAllowsCityScopedTarget|TestDoSlingRefusesCrossStore' -count=1 -v
      - name: Unit tests — order scope (#2830)
        run: go test ./internal/orders/ -run 'TestParseScope|TestValidateRejectsUnknownScope|TestValidateAcceptsCityAndRigScope|TestParseEnv' -count=1 -v
      - name: Unit tests — scale from zero (#2819)
        run: go test ./cmd/gc/ -run 'TestBuildDesiredState_ScaleFromZero' -count=1 -v
      # Whole packages, not a named list. The named lists above cannot catch a
      # regression in code written after they were authored: none of them ran a
      # single test from the gcw-qap3.16 fix. These are the bead/dispatch/
      # compile core, they are green on develop, and they run in well under a
      # minute. internal/formula and internal/molecule joined this line via
      # gcw-vmm00.51: those packages previously ran NOTHING in CI, so a
      # formula-compiler regression test (e.g. gcw-vmm00.50) could pass
      # locally and never execute here.
      - name: Unit tests — bead store, bd dispatch, control dispatch, formula compiler, molecule graph
        run: go test ./internal/beads/ ./internal/bddispatch/ ./internal/dispatch/ ./internal/formula/ ./internal/molecule/ -count=1

  # PR gate for generated-artifact drift (gci-bt1ev). ci.yml (which carries the
  # upstream preflight-generated job) is disabled on this fork, so nothing
  # else catches stale cli.md/config.md/schemas or the OpenAPI spec + generated
  # client. The pre-commit hook cannot be relied on (golangci-lint hangs,
  # gcw-0jxzv), so on drift this job emits an applicable patch: printed in the
  # log, uploaded as an artifact, and (for the genschema docs) consumed by
  # docs-autofix.yml. The dashboard SPA bundle/TS client (`make dashboard-ci`)
  # needs Node + npm install, so it lives in the separate preflight-dashboard
  # job below (gci-bt1ev.1).
  preflight-generated:
    name: Preflight / generated artifacts
    if: ${{ github.repository != 'gastownhall/gascity' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # genschema/genspec are pure Go; the transitive dolt ICU dependency
      # needs CGO headers that are unnecessary here (matches the drift script).
      CGO_ENABLED: "0"
      # Make the spec->client drift check fatal instead of skipping.
      GC_REQUIRE_OAPI_CODEGEN: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: generated
        with:
          filters: |
            generated:
              # Generator code and everything the generators read: the cobra
              # command tree (cli.md), config structs (config.md, schemas) and
              # the API surface (OpenAPI spec, events, generated client).
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'scripts/check-generated-docs-drift.sh'
              - 'scripts/docs-autofix-push.sh'
              - '.github/workflows/fork-verify.yml'
              # Generated outputs (hand edits drift too).
              - 'docs/reference/**'
      - name: Decide whether to run
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.generated.outputs.generated }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$CHANGED" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No generated inputs/outputs changed; skipping drift checks."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        if: ${{ steps.gate.outputs.run == 'true' }}
        with:
          go-version-file: go.mod
      - name: Generated reference docs drift check
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: ./scripts/check-generated-docs-drift.sh
      - name: OpenAPI spec + generated client drift check
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        run: make spec-ci
      - name: make check-schema
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        run: make check-schema
      - name: Print regeneration patch
        id: patch
        if: ${{ failure() }}
        run: |
          git diff > generated-drift.patch
          if [ -s generated-drift.patch ]; then
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
            echo "::error::Generated artifacts are stale. Apply with: git apply generated-drift.patch (artifact 'generated-drift-patch'), or run 'make generate' / 'make spec-ci' and commit."
            cat generated-drift.patch
          fi
      - name: Upload generated-docs freshness patch
        if: ${{ failure() && hashFiles('generated-docs-freshness.patch') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-docs-freshness-patch
          path: generated-docs-freshness.patch
          retention-days: 7
      - name: Upload full regeneration patch
        if: ${{ failure() && steps.patch.outputs.has_patch == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-drift-patch
          path: generated-drift.patch
          retention-days: 7

  # PR gate for dashboard drift (gci-bt1ev.1, child of gci-bt1ev): the typed TS
  # client generated from internal/api/openapi.json and the embedded SPA bundle
  # internal/api/dashboardspa/dist. `make dashboard-ci` typechecks, rebuilds the
  # SPA, regenerates the client and fails if either tree differs (client:
  # Makefile dashboard-ci `git diff --quiet` on gc-supervisor-client; bundle: the
  # second `git diff --quiet -- internal/api/dashboardspa/dist` in the same
  # target, which prints "dist/ is stale"). Separate from
  # preflight-generated because it needs Node + npm ci and is path-filtered
  # more narrowly. Node comes from .nvmrc (same as upstream ci.yml's "22").
  preflight-dashboard:
    name: Preflight / dashboard bundle + client
    if: ${{ github.repository != 'gastownhall/gascity' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: dashboard
        with:
          filters: |
            dashboard:
              - 'internal/api/dashboardspa/**'
              - 'internal/api/dashboardbff/**'
              - 'internal/api/openapi.json'
              - 'Makefile'
              - '.nvmrc'
              - '.github/workflows/fork-verify.yml'
      - name: Decide whether to run
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.dashboard.outputs.dashboard }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$CHANGED" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No dashboard inputs/outputs changed; skipping dashboard drift check."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        if: ${{ steps.gate.outputs.run == 'true' }}
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ steps.gate.outputs.run == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: internal/api/dashboardspa/web/package-lock.json
      - name: Dashboard bundle + client drift check
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: make dashboard-ci
      - name: Print dashboard regeneration patch
        id: patch
        if: ${{ failure() }}
        run: |
          git diff -- internal/api/dashboardspa/dist internal/api/dashboardspa/web/shared/src/generated > dashboard-drift.patch
          if [ -s dashboard-drift.patch ]; then
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
            echo "::error::Dashboard generated client/bundle is stale. Apply with: git apply dashboard-drift.patch (artifact 'dashboard-drift-patch'), or run 'make dashboard-build' + 'npm run generate:client' in internal/api/dashboardspa/web and commit."
            cat dashboard-drift.patch
          fi
      - name: Upload dashboard regeneration patch
        if: ${{ failure() && steps.patch.outputs.has_patch == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-drift-patch
          path: dashboard-drift.patch
          retention-days: 7

  handoff-config-proof:
    name: Fork / handoff-config proof
    needs: verify
    if: ${{ always() && github.repository == 'wbern/gascity' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require executed proof from successful verification
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          PROOF_PASSED: ${{ needs.verify.outputs.handoff-config-proof }}
        run: test "$VERIFY_RESULT" = success && test "$PROOF_PASSED" = true

  # Static analysis belongs on a runner, not on a developer's pre-commit hook.
  # Whole-program linters (staticcheck/unused/unparam) over ~3,400 Go files
  # need roughly 6.7GB at the default concurrency=NumCPU; on a workstation that
  # OOM-killed two workers and left a change deployed unlinted. This job is
  # deliberately NOT a required check yet: it reports first, so its true
  # baseline on develop is measured rather than assumed.
  lint:
    if: ${{ github.repository != 'gastownhall/gascity' }}
    runs-on: ubuntu-latest
    env:
      DOLT_VERSION: "2.6.0"
      BD_VERSION: "v1.3.4"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-gascity-ubuntu
        with:
          dolt-version: ${{ env.DOLT_VERSION }}
          bd-version: ${{ env.BD_VERSION }}
          install-claude-cli: "false"
      - name: Get golangci-lint + Go toolchain versions for cache key
        id: glint-version
        run: |
          version=$(grep -m1 '^GOLANGCI_LINT_VERSION := ' Makefile | awk '{print $3}')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "goversion=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: Restore golangci-lint cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/golangci-lint
          # Exact-key-only restore, matching upstream ci.yml: a prefix fallback
          # let an incompatible cache be inherited and re-saved forward, which
          # produced a SA5011 false-positive storm upstream (ga-v7x9vk).
          key: ${{ runner.os }}-golangci-lint-${{ steps.glint-version.outputs.version }}-${{ steps.glint-version.outputs.goversion }}-${{ hashFiles('go.sum', '.golangci.yml') }}
      - name: Lint full repository
        env:
          GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.cache/golangci-lint
          # Bound the peak the OOM came from. ubuntu-latest is 4 vCPU / 16GB;
          # the unbounded default is what exhausted a 10-core workstation.
          LINT_FLAGS: --concurrency=2 --timeout=20m
        run: make lint
